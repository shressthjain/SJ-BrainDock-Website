<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #f0f0f0;
  font-family: 'DM Sans', sans-serif;
  overflow-x: hidden;
}

.scroll-container {
  height: 800vh;
  position: relative;
}

.sticky-frame {
  position: sticky;
  top: 0;
  height: 100vh;
  width: 100vw;
  overflow: hidden;
  transition: background 0.7s ease;
  background: linear-gradient(150deg, #f4f6e8, #eef2dc);
}

/* ── Left Text Panel ── */
.text-panel {
  position: absolute;
  left: 4vw;
  top: 50%;
  transform: translateY(-50%);
  max-width: 280px;
  z-index: 10;
}

.text-card {
  position: absolute;
  top: 0; left: 0;
  opacity: 0;
  transition: opacity 0.5s ease;
  pointer-events: none;
}
.text-card.active {
  opacity: 1;
  pointer-events: auto;
}

.text-card .dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  margin-bottom: 14px;
}

.text-card .label {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 2px;
  text-transform: uppercase;
  font-variant: small-caps;
  color: #888;
  margin-bottom: 12px;
}

.text-card .heading {
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  font-size: 32px;
  line-height: 1.2;
  color: #1d1d1f;
}

/* ── Stage ── */
.stage {
  position: absolute;
  right: 6vw;
  top: 50%;
  transform: translateY(-50%) rotateX(6deg) rotateY(-14deg);
  width: 420px;
  height: 320px;
  perspective: 1600px;
  transform-style: preserve-3d;
}

/* ── Mac Wrapper (each laptop) ── */
.mac-wrapper {
  position: absolute;
  width: 100%;
  height: 100%;
  left: 0; top: 0;
  transform-style: preserve-3d;
}

/* ── Mac Body (gets rotateY for flip) ── */
.mac-body {
  position: absolute;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  will-change: transform;
}

/* ── Lid (front face) ── */
.lid {
  position: absolute;
  width: 92%;
  left: 4%;
  top: 0;
  height: 72%;
  transform-style: preserve-3d;
  backface-visibility: hidden;
}

.lid-shell {
  position: absolute;
  inset: 0;
  border-radius: 10px;
  overflow: hidden;
}

.lid-shell .bezel {
  position: absolute;
  top: 3%;
  left: 1.5%;
  right: 1.5%;
  bottom: 1.5%;
  background: #111;
  border-radius: 4px;
  overflow: hidden;
}

.lid-shell .camera {
  position: absolute;
  top: 1%;
  left: 50%;
  transform: translateX(-50%);
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #222;
  border: 1px solid #333;
  z-index: 2;
}

.screen-svg {
  width: 100%;
  height: 100%;
  display: block;
}

/* ── Lid Back ── */
.lid-back {
  position: absolute;
  width: 92%;
  left: 4%;
  top: 0;
  height: 72%;
  border-radius: 10px;
  transform: rotateY(180deg);
  backface-visibility: hidden;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.lid-back .apple-logo {
  font-size: 42px;
  color: rgba(255,255,255,0.2);
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

.lid-back .hello-text {
  position: absolute;
  bottom: 12%;
  right: 12%;
  font-style: italic;
  font-size: 14px;
  color: rgba(255,255,255,0.15);
  font-family: 'DM Sans', sans-serif;
}

.lid-back .specular {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 30%;
  background: linear-gradient(180deg, rgba(255,255,255,0.12) 0%, transparent 100%);
  pointer-events: none;
}

/* ── Lid Thickness ── */
.lid-thickness {
  position: absolute;
  width: 92%;
  left: 4%;
  top: 72%;
  height: 3px;
  transform: rotateX(-90deg);
  transform-origin: top center;
  border-radius: 0 0 2px 2px;
}

/* ── Hinge ── */
.hinge {
  position: absolute;
  width: 90%;
  left: 5%;
  top: calc(72% + 1px);
  height: 3px;
  background: linear-gradient(180deg, #999, #666);
  border-radius: 1px;
}

/* ── Base ── */
.base {
  position: absolute;
  width: 100%;
  left: 0;
  top: calc(72% + 4px);
  padding-top: 3.8%;
  transform-style: preserve-3d;
}

.base-inner {
  width: 100%;
  height: 100%;
  min-height: 18px;
  border-radius: 0 0 8px 8px;
  position: relative;
  overflow: hidden;
}

.base-inner::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: rgba(255,255,255,0.6);
}

.base-inner::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 40%;
  background: linear-gradient(180deg, transparent, rgba(0,0,0,0.08));
}

/* ── MagSafe Notch ── */
.notch {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 5.5%;
  height: 76%;
  background: #222;
  border-radius: 0 0 3px 3px;
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.5), 0 0 0 0.5px rgba(255,255,255,0.15);
}

/* ── Drop Shadow ── */
.mac-body::after {
  content: '';
  position: absolute;
  bottom: -20px;
  left: 5%;
  right: 5%;
  height: 30px;
  border-radius: 50%;
  box-shadow:
    0 40px 100px rgba(0,0,0,0.35),
    0 18px 40px rgba(0,0,0,0.20),
    0 6px 12px rgba(0,0,0,0.12);
  z-index: -1;
}

/* ── Colour Variants ── */
/* Citrus */
.mac-citrus .lid-shell { background: #c9d84a; }
.mac-citrus .lid-back { background: #c9d84a; }
.mac-citrus .lid-thickness { background: #b2bc46; }
.mac-citrus .base-inner { background: linear-gradient(180deg, #d4e068, #c2cc56, #b2bc46); }

/* Blush */
.mac-blush .lid-shell { background: #f5c0cc; }
.mac-blush .lid-back { background: #f5c0cc; }
.mac-blush .lid-thickness { background: #dca0b0; }
.mac-blush .base-inner { background: linear-gradient(180deg, #f6c4d0, #e8aebe, #dca0b0); }

/* Midnight */
.mac-midnight .lid-shell { background: #383b4a; }
.mac-midnight .lid-back { background: #383b4a; }
.mac-midnight .lid-thickness { background: #282a38; }
.mac-midnight .base-inner { background: linear-gradient(180deg, #484b5e, #363848, #282a38); }

/* Silver */
.mac-silver .lid-shell { background: #d4d4d6; }
.mac-silver .lid-back { background: #d4d4d6; }
.mac-silver .lid-thickness { background: #bebebc; }
.mac-silver .base-inner { background: linear-gradient(180deg, #e2e2e4, #cecece, #bebebc); }

@media (max-width: 900px) {
  .stage {
    width: 320px;
    height: 240px;
    right: 2vw;
  }
  .text-panel {
    max-width: 180px;
    left: 2vw;
  }
  .text-card .heading {
    font-size: 24px;
  }
}

@media (max-width: 600px) {
  .stage {
    width: 260px;
    height: 200px;
    right: 0;
    top: 60%;
  }
  .text-panel {
    top: 20%;
    transform: none;
  }
}
</style>
</head>

  <!-- Animated Grid Background -->
  <script>
  ;(function () {
    'use strict'
    var SVG_NS = 'http://www.w3.org/2000/svg'
    var CELL_SIZE = 40
    var SQUARE_COUNT = 20
    var MIN_DURATION = 3
    var MAX_DURATION = 8

    if (document.querySelector('.animated-grid-bg')) return

    var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches

    var svg = document.createElementNS(SVG_NS, 'svg')
    svg.setAttribute('class', 'animated-grid-bg')
    svg.setAttribute('aria-hidden', 'true')

    var defs = document.createElementNS(SVG_NS, 'defs')
    var pattern = document.createElementNS(SVG_NS, 'pattern')
    pattern.setAttribute('id', 'grid-pattern-landing')
    pattern.setAttribute('width', CELL_SIZE)
    pattern.setAttribute('height', CELL_SIZE)
    pattern.setAttribute('patternUnits', 'userSpaceOnUse')
    pattern.setAttribute('x', '-1')
    pattern.setAttribute('y', '-1')

    var path = document.createElementNS(SVG_NS, 'path')
    path.setAttribute('d', 'M.5 ' + CELL_SIZE + 'V.5H' + CELL_SIZE)
    path.setAttribute('fill', 'none')
    path.setAttribute('stroke', 'currentColor')
    path.setAttribute('stroke-width', '1')
    pattern.appendChild(path)
    defs.appendChild(pattern)
    svg.appendChild(defs)

    var bgRect = document.createElementNS(SVG_NS, 'rect')
    bgRect.setAttribute('width', '100%')
    bgRect.setAttribute('height', '100%')
    bgRect.setAttribute('fill', 'url(#grid-pattern-landing)')
    svg.appendChild(bgRect)

    if (!reducedMotion) {
      var squaresGroup = document.createElementNS(SVG_NS, 'svg')
      squaresGroup.setAttribute('class', 'grid-squares-group')
      squaresGroup.style.overflow = 'visible'

      var squares = []

      function positionSquare(rect) {
        var cols = Math.floor(window.innerWidth / CELL_SIZE)
        var rows = Math.floor(window.innerHeight / CELL_SIZE)
        if (cols < 1 || rows < 1) {
          rect.setAttribute('x', -CELL_SIZE)
          rect.setAttribute('y', -CELL_SIZE)
          return
        }
        rect.setAttribute('x', Math.floor(Math.random() * cols) * CELL_SIZE + 1)
        rect.setAttribute('y', Math.floor(Math.random() * rows) * CELL_SIZE + 1)
      }

      for (var i = 0; i < SQUARE_COUNT; i++) {
        var rect = document.createElementNS(SVG_NS, 'rect')
        rect.setAttribute('class', 'grid-square')
        rect.setAttribute('width', CELL_SIZE - 1)
        rect.setAttribute('height', CELL_SIZE - 1)
        rect.setAttribute('fill', 'rgba(176, 176, 176, 1)')
        rect.setAttribute('stroke-width', '0')

        var duration = MIN_DURATION + Math.random() * (MAX_DURATION - MIN_DURATION)
        var delay = Math.random() * duration
        rect.style.setProperty('--grid-duration', duration.toFixed(1) + 's')
        rect.style.setProperty('--grid-delay', delay.toFixed(1) + 's')

        squaresGroup.appendChild(rect)
        squares.push(rect)
      }

      svg.appendChild(squaresGroup)
      squares.forEach(positionSquare)

      squares.forEach(function (rect) {
        rect.addEventListener('animationiteration', function () { positionSquare(rect) })
      })

      var resizeTimer = null
      window.addEventListener('resize', function () {
        clearTimeout(resizeTimer)
        resizeTimer = setTimeout(function () { squares.forEach(positionSquare) }, 250)
      })

      document.addEventListener('visibilitychange', function () {
        var state = document.hidden ? 'paused' : 'running'
        squares.forEach(function (rect) { rect.style.animationPlayState = state })
      })
    }

    document.body.insertBefore(svg, document.body.firstChild)
  })()
  </script>

    citrus:   { rz: 3,   tz: 0,    scale: 1.00 }
  };

  // Background gradients per laptop
  const bgGradients = {
    citrus:   'linear-gradient(150deg, #f4f6e8, #eef2dc)',
    blush:    'linear-gradient(150deg, #fdf4f6, #f8eef2)',
    midnight: 'linear-gradient(150deg, #edeef4, #e4e6f0)',
    silver:   'linear-gradient(150deg, #f4f4f6, #eaeaec)'
  };

  // Cache DOM refs
  const wrappers = {};
  const bodies = {};
  const textCards = {};

  ORDER.forEach(name => {
    wrappers[name] = document.getElementById('wrap-' + name);
    bodies[name] = document.getElementById('body-' + name);
    textCards[name] = document.getElementById('text-' + name);
  });

  let activeText = null;
  let ticking = false;

  // Easing
  function easeInOut(t) { return t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t; }
  function easeOut(t) { return 1 - (1-t)*(1-t); }
  function easeIn(t) { return t*t; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function lerp(a, b, t) { return a + (b - a) * t; }

  function getScrollProgress() {
    const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
    const containerTop = scrollContainer.offsetTop;
    const containerHeight = scrollContainer.offsetHeight - window.innerHeight;
    return clamp((scrollTop - containerTop) / containerHeight, 0, 1);
  }

  function activateText(name) {
    if (activeText === name) return;
    activeText = name;
    ORDER.forEach(n => {
      textCards[n].classList.toggle('active', n === name);
    });
    stickyFrame.style.background = bgGradients[name];
  }

  function tick() {
    const P = getScrollProgress();

    // Determine which laptop is most active for text
    let bestName = ORDER[0];
    let bestActivity = -1;

    ORDER.forEach((name, i) => {
      const loc = clamp((P - i * SLOT) / SLOT, 0, 1);
      const rest = restConfig[name];

      // Phase A: lift out (0 → 0.12)
      const liftP = easeOut(clamp(loc / 0.12, 0, 1));
      // Phase F: sink back (0.85 → 1.0)
      const sinkP = easeIn(clamp((loc - 0.85) / 0.15, 0, 1));
      const active = clamp(liftP - sinkP, 0, 1);

      // Translation Z and scale
      const tz = rest.tz + active * 140;
      const scale = rest.scale + active * (1.12 - rest.scale);

      // Sweep rotateY (0.12 → 0.85)
      let sweepRaw = clamp((loc - 0.12) / 0.73, 0, 1);
      let sweepP = easeInOut(sweepRaw);
      let rotateY = -90 + sweepP * 180; // -90 → +90

      // When not active at all, keep rotateY at -90 (showing back)
      if (loc <= 0) rotateY = -90;
      if (loc >= 1) rotateY = 90;

      // RotateX tilt during sweep phases B-E
      const inSweep = (loc > 0.12 && loc < 0.85) ? 1 : 0;
      const sweepEntry = clamp((loc - 0.10) / 0.05, 0, 1);
      const sweepExit = clamp((loc - 0.82) / 0.05, 0, 1);
      const tiltAmount = clamp(sweepEntry - sweepExit, 0, 1);
      const rotateX = -8 * tiltAmount;

      // Apply wrapper transform (position in arc + lift)
      wrappers[name].style.transform =
        `rotate(${rest.rz}deg) translateZ(${tz}px) scale(${scale})`;

      // Apply body transform (flip rotation)
      bodies[name].style.transform =
        `rotateY(${rotateY}deg) rotateX(${rotateX}deg)`;

      // Track which laptop is most "facing viewer" for text
      const facingness = (loc > 0.22 && loc < 0.72) ? (1 - Math.abs(rotateY) / 90) : 0;
      if (facingness > bestActivity) {
        bestActivity = facingness;
        bestName = name;
      }
    });

    // Activate text for the most visible laptop
    if (bestActivity > 0.1) {
      activateText(bestName);
    }

    ticking = false;
  }

  function onScroll() {
    if (!ticking) {
      ticking = true;
      requestAnimationFrame(tick);
    }
  }

  window.addEventListener('scroll', onScroll, { passive: true });

  // Initial state
  activateText('citrus');
  tick();
})();
</script>

</body>
</html>
